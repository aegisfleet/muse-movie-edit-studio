        start_offset: 15
        size: 130
        rotation: -10
        x: 840
        y: 460
      - emoji: "💖"
        start_offset: 75
        size: 130
        rotation: 12
        x: 180
        y: 860
    se:
      - sound: "audio/se_pop.wav"
        start_offset: 10
        volume: 0.65

