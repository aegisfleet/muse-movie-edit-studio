# Video Editing Configuration for Antigravity & Remotion Pipeline
project:
  title: "Pomeranian Toy Adventure"
  input_video: "inputs/GX010096.MP4"
  output_video: "outputs/final.mp4"
  duration_sec: 30
  target_fps: 30
  resolution:
    width: 1080
    height: 1920
    aspect_ratio: "9:16"

theme:
  channel_name: "ポメラニアン（♀）の内なる声"
  channel_badge: "🐾🌸"
  bgm_track: "audio/bgm_dynamic_30s.wav"
  bgm_volume: 0.22

color_grading:
  source_color_space: "bt2020nc"
  source_transfer: "arib-std-b67" # HLG
  target_color_space: "bt709"
  tonemap_algorithm: "hable"

scenes:
  - id: "scene_1"
    start_time: "00:00:54.5"
    duration_sec: 5.0
    crop_x: 0.64 # YOLO自動検出: オモチャ発見・格闘する犬をど真ん中に
    profile: "curves=master='0/0 0.15/0.25 0.4/0.52 0.75/0.82 1/1',eq=contrast=1.06:saturation=1.26"
    border_color: "#FF6B8B"
    border_theme: "cute"
    particle_type: "hearts"
    speed_lines: false
    narration:
      text: "新しいオモチャ発見！これわたしのなんだからね！💖"
      audio_file: "audio/dog_vocal_sc1.wav"
      start_offset_frame: 10
    subtitles:
      - text: "新しいオモチャ発見！🧸✨"
        start_offset: 10
        duration: 65
        font_size: 74
        text_color: "#FFFFFF"
        glow_color: "rgba(255, 107, 139, 0.95)"
        spark_color: "#FF6B8B"
        y_offset: -40
      - text: "絶対に離さないんだから！😤💖"
        start_offset: 75
        duration: 65
        font_size: 72
        text_color: "#FFE6AA"
        glow_color: "rgba(255, 158, 69, 0.95)"
        spark_color: "#FF9F45"
        y_offset: -40
    stickers:
